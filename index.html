    <section class="section teaching-section" id="teaching">
      <div class="container">
        <p class="section-kicker">Academic Teaching</p>
        <h2>Teaching Experience &amp; Student Mentorship</h2>
        <p class="teaching-intro">My teaching connects structural engineering fundamentals with numerical modeling, experimental mechanics, computer vision, and hands-on design. I have supported graduate and undergraduate instruction, laboratory education, and interdisciplinary research mentorship.</p>
        <div class="teaching-cards">
          <article class="teaching-card"><div class="teaching-icon" aria-hidden="true">♧</div><span class="teaching-date">FALL 2019 · UNIVERSITY OF VIRGINIA</span><h3>Graduate Teaching Internship Fellow</h3><p class="teaching-course">CE 5340 · Advanced Topics in Structural Engineering</p><p>Co-instructor with Professor Jose Gomez. Developed advanced course modules, organized the syllabus and course project, and delivered lectures on numerical analysis and finite element concepts. Graduate-level instruction included in-person and web-based delivery.</p></article>
          <article class="teaching-card"><div class="teaching-icon" aria-hidden="true">▤</div><span class="teaching-date">SPRING 2019 &amp; 2020 · UNIVERSITY OF VIRGINIA</span><h3>Teaching Fellow</h3><p class="teaching-course">CE 3330 · Introduction to Design of Structural Systems</p><p>Co-developed the syllabus and course project, organized instructional modules on computer vision for structural analysis, and supported student project planning and progress.</p></article>
          <article class="teaching-card"><div class="teaching-icon" aria-hidden="true">⚙</div><span class="teaching-date">SPRING 2019 &amp; 2020 · UNIVERSITY OF VIRGINIA</span><h3>Laboratory Instructor</h3><p class="teaching-course">CE 3330 · Structural Systems Laboratory</p><p>Coordinated experiments and project activities using MTS testing equipment, 3D printing, digital cameras, and digital image correlation. Guided problem-solving sessions, exercises, and quizzes.</p></article>
          <article class="teaching-card"><div class="teaching-icon" aria-hidden="true">∑</div><span class="teaching-date">FALL 2008 · SHARIF UNIVERSITY OF TECHNOLOGY</span><h3>Teaching Assistant</h3><p class="teaching-course">Introduction to Structural Optimization</p><p>Contributed to syllabus and course-project development, taught MATLAB-based computational modules, and guided problem-solving sessions, quizzes, and exercises.</p></article>
        </div>
        <article class="card teaching-syllabus" aria-labelledby="ce5340-syllabus-title" style="margin-top:22px">
          <p class="section-kicker">Course Syllabus · Fall 2019 · University of Virginia</p>
          <h3 id="ce5340-syllabus-title">CE 5340 · Advanced Topics in Structural Engineering</h3>
          <p>Matrix structural analysis through the direct stiffness method, virtual work, and computational implementation. Instructors: Jose P. Gomez, P.E., Ph.D., and Mehrdad S. Dizaji.</p>
          <div class="tags" style="margin-top:16px"><span>Matrix analysis</span><span>Direct stiffness method</span><span>MATLAB &amp; Mathcad</span><span>Finite elements</span></div>
          <details style="margin-top:18px;color:var(--muted)">
            <summary style="cursor:pointer;color:var(--cyan);font-weight:700">Explore syllabus highlights</summary>
            <p style="margin-top:16px"><strong>Prerequisite:</strong> CE 3300 Structural Mechanics or equivalent.</p>
            <p style="margin-top:12px"><strong>Course focus:</strong> Relate external loads to member forces, deformations, and global displacements using equilibrium, force–deformation relationships, and compatibility. Formulate element stiffness matrices, assemble the global stiffness matrix, and solve structural systems with MATLAB, Mathcad, and Excel.</p>

  <script>
    const twinScene = document.getElementById('digital-twin-scene');
    const motionToggle = document.getElementById('motion-toggle');
    const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
    let userPaused = false;
    let userPlayed = false;
    let backgroundVisible = true;
    function syncTwinMotion() {
      const paused = userPaused || (motionPreference.matches && !userPlayed) || document.hidden || !backgroundVisible;
      twinScene.classList.toggle('twin-paused', paused);
      if (paused) twinScene.pauseAnimations(); else twinScene.unpauseAnimations();
      motionToggle.hidden = !backgroundVisible;
      motionToggle.textContent = paused ? 'Play background' : 'Pause background';
      motionToggle.setAttribute('aria-pressed', String(!paused));
    }
    motionToggle.addEventListener('click', () => {
      const paused = twinScene.classList.contains('twin-paused');
      userPaused = !paused;
      if(paused) userPlayed = true;
      syncTwinMotion();
    });
    motionPreference.addEventListener('change', () => { userPlayed = false; syncTwinMotion(); });
    document.addEventListener('visibilitychange', syncTwinMotion);
    // Keep the fixed background visible only through Home and About me.
    const backgroundLayer = document.querySelector('.research-background');
    const backgroundEnd = document.getElementById('about');
    let backgroundBoundaryFrame = null;
    function updateBackgroundBoundary() {
      backgroundBoundaryFrame = null;
      const bottom = backgroundEnd.getBoundingClientRect().bottom;
      const viewportHeight = window.innerHeight;
      const visible = bottom > 0;
      const clip = Math.max(0, Math.min(viewportHeight, viewportHeight - bottom));
      backgroundLayer.style.clipPath = `inset(0 0 ${clip}px 0)`;
      backgroundLayer.style.visibility = visible ? 'visible' : 'hidden';
      if (backgroundVisible !== visible) {
        backgroundVisible = visible;
        syncTwinMotion();
      }
    }
    function scheduleBackgroundBoundary() {
      if (backgroundBoundaryFrame === null) {
        backgroundBoundaryFrame = requestAnimationFrame(updateBackgroundBoundary);
      }
    }
    window.addEventListener('scroll', scheduleBackgroundBoundary, { passive: true });
    window.addEventListener('resize', scheduleBackgroundBoundary);
    window.addEventListener('pageshow', scheduleBackgroundBoundary);
    if ('ResizeObserver' in window) {
      new ResizeObserver(scheduleBackgroundBoundary).observe(backgroundEnd);
    }
    updateBackgroundBoundary();
    syncTwinMotion();
    document.getElementById("year").textContent = new Date().getFullYear();
    const revealTargets = document.querySelectorAll('.card,.project,.gallery-item,.pub-list article,.timeline article,.stats > div,.two-col > div');
    revealTargets.forEach(el => el.classList.add('reveal'));
    const io = new IntersectionObserver(entries => entries.forEach(entry => {
      if (entry.isIntersecting) { entry.target.classList.add('visible'); io.unobserve(entry.target); }
    }), { threshold: .12 });
    revealTargets.forEach(el => io.observe(el));

    // Type the introduction once on entry; reserve its complete layout throughout.
    (() => {
      const section = document.getElementById('about');
      const preference = window.matchMedia('(prefers-reduced-motion: reduce)');
      if (!section || preference.matches || !('IntersectionObserver' in window)) return;
      const lines = Array.from(section.querySelectorAll('h1,.eyebrow,.lead,.hero-subtitle')).map(el => {
        const text = el.textContent;
        const readable = document.createElement('span');
        readable.className = 'about-readable';
        readable.textContent = text;
        const space = document.createElement('span');
        space.className = 'typing-space';
        space.setAttribute('aria-hidden', 'true');
        space.textContent = text;
        const output = document.createElement('span');
        output.className = 'typing-output';
        output.setAttribute('aria-hidden', 'true');
        el.classList.add('typing-block');
        el.replaceChildren(readable, space, output);
        return { output, characters: Array.from(text) };
      });
      let line = 0, character = 0, timer, started = false, finished = false;
      function finish() {
        finished = true;
        clearTimeout(timer);
        lines.forEach(item => {
          item.output.textContent = item.characters.join('');
          item.output.classList.remove('typing-active');
        });
      }
      function type() {
        if (finished) return;
        if (preference.matches) { finish(); return; }
        if (document.hidden) { timer = setTimeout(type, 150); return; }
        const item = lines[line];
        item.output.classList.add('typing-active');
        const next = item.characters[character++];
        item.output.textContent += next;
        let delay = /[.,;:]/.test(next) ? 100 : (next === ' ' ? 12 : 17);
        if (character === item.characters.length) {
          item.output.classList.remove('typing-active');
          line++; character = 0; delay = 220;
          if (line === lines.length) { finish(); return; }
        }
        timer = setTimeout(type, delay);
      }
      const observer = new IntersectionObserver(entries => {
        if (!started && entries.some(entry => entry.isIntersecting)) {
          started = true; observer.disconnect(); type();
        }
      }, { threshold: .15 });
      observer.observe(section);
      preference.addEventListener('change', () => {
        if (preference.matches) { observer.disconnect(); finish(); }
      });
    })();
  </script>

<script>
(() => {
 const panel = document.getElementById('adaptive-twin-overview');

 const meshes = ['adt-fe-mesh','adt-mr-mesh'].map(id => {

  return Array.from({length:40}, () => {

 });
 function draw() {
  const factor = Number(load.value)/100;
  const amplitude = factor * (19 + 5*Math.sin(phase));
  const point = (x,y) => {const u=x/10; return [30+u*244+y*5,92+amplitude*4*u*(1-u)-y*7];};
  meshes.forEach((cells,mesh) => cells.forEach((cell,i) => {
   const x=i%10, y=Math.floor(i/10), u=(x+.5)/10;
   cell.setAttribute('points',[point(x,y),point(x+1,y),point(x+1,y+1),point(x,y+1)].map(p=>p.join(',')).join(' '));
   const v=field.value==='displacement'?4*u*(1-u):field.value==='strain'?Math.abs(y-1.5)/1.5*(.45+.55*Math.sin(Math.PI*u)):(.25+.75*Math.sin(Math.PI*u))*(y+1)/4;
   cell.setAttribute('fill',`hsl(${220-v*factor*205} 65% ${mesh?48:43}%)`);
   cell.setAttribute('stroke',mesh?'#8bedd8':'#a3c5d0');cell.setAttribute('stroke-width','.65');

  document.getElementById('adt-deformed-coupon').setAttribute('transform',`translate(${factor*1.5} ${-factor*2}) scale(${1-factor*.04} ${1+factor*.035})`);

 }
 function animate(time) {
  frame=null;
  if(paused||document.hidden||!visible){last=null;return;}
  if(last!==null)phase+=Math.min(time-last,100)/900;
  last=time;draw();frame=requestAnimationFrame(animate);
 }
 function sync() {

(() => {
 const panel=document.getElementById('vision-shm-overview');

 let paused=preference.matches, progress=preference.matches?100:0, frame=null, last=null, visible=true;
 const group=document.getElementById('shm-voxels');
 const cells=Array.from({length:112},(_,i)=>{

 });
 function draw(){

if('IntersectionObserver'in window)new IntersectionObserver(e=>{visible=e[0].isIntersecting;sync();},{threshold:.01}).observe(root);else visible=true;document.addEventListener('visibilitychange',sync);motion.addEventListener('change',()=>{if(motion.matches){running=false;sync();}});render();sync();
})();
